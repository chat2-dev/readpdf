<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF Dictionary App</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <style>
    body {
      font-family: Arial;
      padding: 10px;
    }



    canvas {
      display: block;
      border: none;
      margin-top: 10px;
      margin: 0;
      padding: 0;
    }
    #pdf-container {
       height:80vh;
       overflow-y: scroll;
       border:1px solid #ccc;
    }
    #popup {
      position: fixed;
      bottom: 20px;
      left: 10px;
      right: 10px;
      background: black;
      color: white;
      padding: 15px;
      border-radius: 10px;
      display: none;
      z-index: 1000;
      max-height: 200px;
      overflow-y: auto;
    }
    
    .page-wrapper {
      position: relative;
      margin-bottom: 10px;
      margin: 0;
      padding: 0;
      width: fit-content;
    }
    
    .highlight-overlay {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 50;
      cursor: pointer;
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
      display: block;
    }
    
    #ocr-status {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #4CAF50;
      color: white;
      padding: 10px 15px;
      border-radius: 5px;
      display: none;
      z-index: 999;
    }

  </style>
</head>
<body>

<h3>Upload PDF</h3>
<input type="file" id="upload" accept="application/pdf">


  <div id="pdf-container">
  <canvas id="pdf-render"></canvas>
</div>

<div id="popup"></div>
<div id="ocr-status"></div>

<script>
  //database
  
  let pdfDoc = null; 
let currentPDFData = null;
let pageNum = 1;

  let db;

let request = indexedDB.open("PDFDatabase", 1);

request.onupgradeneeded = function(e) {
  db = e.target.result;
  db.createObjectStore("pdfs", { keyPath: "id" });
};

request.onsuccess = function(e) {
  db = e.target.result;
};

  // choose file 
 
document.getElementById('upload').addEventListener('change', function(e) {
  const file = e.target.files[0];
  const fileReader = new FileReader();

  fileReader.onload = function() {
  const typedarray = new Uint8Array(this.result);

  // 🔥 ADD THIS LINE (important)
  currentPDFData = this.result;

  pdfjsLib.getDocument(typedarray).promise.then(function(pdf) {
    pdfDoc = pdf;
    renderAllPages(); // also changed
  });
};

  fileReader.readAsArrayBuffer(file);
});

// render

async function renderPageToCanvas(page) {
    const container = document.getElementById("pdf-container");

    // Page wrapper with absolute overlay text layer
    const pageDiv = document.createElement("div");
    pageDiv.style.position = "relative";
    pageDiv.style.marginBottom = "10px";

    // Create canvas for rendering
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    const viewport = page.getViewport({ scale: 1.5 });
    canvas.height = viewport.height;
    canvas.width = viewport.width;
    canvas.style.display = "block";

    // Create text layer overlay
    const textLayerDiv = document.createElement("div");
    textLayerDiv.style.position = "absolute";
    textLayerDiv.style.left = "0";
    textLayerDiv.style.top = "0";
    textLayerDiv.style.height = canvas.height + "px";
    textLayerDiv.style.width = canvas.width + "px";
    textLayerDiv.style.pointerEvents = "none";
    textLayerDiv.className = "textLayer";

    pageDiv.appendChild(canvas);
    pageDiv.appendChild(textLayerDiv);
    container.appendChild(pageDiv);

    await page.render({ canvasContext: ctx, viewport: viewport }).promise;

    const textContent = await page.getTextContent();

    // Render text layer for word alignment and click targets
    await pdfjsLib.renderTextLayer({
        textContent: textContent,
        container: textLayerDiv,
        viewport: viewport,
        textDivs: []
    }).promise;

    // Add click handlers to word spans in text layer
    const wordSpans = textLayerDiv.querySelectorAll("span");
    wordSpans.forEach(span => {
        span.style.pointerEvents = "auto";
        span.style.backgroundColor = "transparent";
        span.style.transition = "background-color 0.2s ease";

        span.addEventListener("click", event => {
            event.stopPropagation();
            wordSpans.forEach(s => s.classList.remove("highlight-active"));
            span.classList.add("highlight-active");

            const word = span.textContent.trim();
            if (word) {
                showMeaning(word);
            }
        });
    });

    // If no text spans (image-based PDF), fallback to OCR
    if (wordSpans.length === 0) {
        const imageTextItems = await attemptOCR(canvas, viewport);
        setupCanvasClickHandler(canvas, null, viewport, imageTextItems);
    }
}

function needsOCR(textItems) {
    // Threshold: if we have very few text items, likely an image
    if (textItems.length < 3) {
        return true;
    }
    
    // Calculate total meaningful text length
    let totalTextLength = 0;
    let emptyItems = 0;
    
    textItems.forEach(item => {
        const text = item.str.trim();
        if (text.length === 0) {
            emptyItems++;
        } else {
            totalTextLength += text.length;
        }
    });
    
    console.log(`📊 Text analysis - Items: ${textItems.length}, Meaningful text: ${totalTextLength} chars, Empty: ${emptyItems}`);
    
    // If we have decent text content (more than 50 meaningful characters), skip OCR
    if (totalTextLength > 50) {
        return false;
    }
    
    // If more than 50% of items are empty/whitespace, likely needs OCR
    const emptyRatio = emptyItems / textItems.length;
    if (emptyRatio > 0.5) {
        console.log(`⚠️ High empty ratio (${(emptyRatio * 100).toFixed(1)}%), needs OCR`);
        return true;
    }
    
    return false;
}

function parseOCRResults(lines, viewport) {
    const textItems = [];
    
    lines.forEach((line) => {
        if (line.words) {
            line.words.forEach((word) => {
                if (word.text && word.text.trim()) {
                    // Extract bounding box info from Tesseract
                    const bbox = word.bbox;
                    const x0 = bbox.x0;
                    const y0 = bbox.y0;
                    const x1 = bbox.x1;
                    const y1 = bbox.y1;
                    
                    // Convert Tesseract coordinates to PDF.js format
                    // Tesseract: (0,0) is top-left, Y increases downward
                    // PDF.js: (0,0) is bottom-left, Y increases upward
                    const pdfX = x0;
                    const pdfY = viewport.height - y1;  // Convert to PDF baseline coordinate
                    
                    textItems.push({
                        str: word.text,
                        width: x1 - x0,
                        height: y1 - y0,
                        transform: [1, 0, 0, 1, pdfX, pdfY]
                    });
                    
                    console.log(`📝 OCR word "${word.text}" at PDF coords (${pdfX}, ${pdfY}), size ${x1 - x0}x${y1 - y0}`);
                }
            });
        }
    });
    
    console.log(`📊 Total OCR text items: ${textItems.length}`);
    return textItems;
}

function showOCRStatus(message, duration = 0) {
    const statusEl = document.getElementById("ocr-status");
    statusEl.textContent = message;
    statusEl.style.display = "block";
    
    if (duration > 0) {
        setTimeout(() => {
            statusEl.style.display = "none";
        }, duration);
    }
}

function setupCanvasClickHandler(canvas, highlightCanvas, viewport, textItems) {
    canvas.addEventListener("click", function (e) {
        const rect = canvas.getBoundingClientRect();

        // Get mouse click coordinates relative to canvas dimensions
        const x = (e.clientX - rect.left) * (canvas.width / rect.width); // Scale click to canvas resolution
        const y = (e.clientY - rect.top) * (canvas.height / rect.height);

        console.log(`🖱️ Clicked at canvas X:${x}, Y:${y}`);

        const hCtx = highlightCanvas.getContext("2d");
        hCtx.clearRect(0, 0, highlightCanvas.width, highlightCanvas.height); // Clear previous highlights

        let found = false;

        // Check each word's coordinates
        textItems.forEach((item) => {
            const tx = item.transform[4]; // Word's X coordinate
            const ty = item.transform[5]; // Word's baseline Y coordinate
            const width = item.width; // Width of the word
            const height = item.height; // Height of the word

            // Convert PDF coordinates to canvas coordinates
            // PDF: (0,0) bottom-left, Y increases upward
            // Canvas: (0,0) top-left, Y increases downward
            const canvasX = tx;
            const canvasYTop = viewport.height - (ty + height); // Top of text in canvas coords
            const canvasYBottom = viewport.height - ty; // Bottom of text in canvas coords

            console.log(`Checking word "${item.str}": PDF(${tx},${ty}) -> Canvas(${canvasX},${canvasYTop})`);

            // Check if click is within word's bounding box
            if (x >= canvasX && x <= canvasX + width && y >= canvasYTop && y <= canvasYBottom) {
                console.log("✨ Highlighting word:", item.str);

                // Draw the highlight box using correct canvas coordinates
                hCtx.fillStyle = "rgba(0, 150, 255, 0.3)"; // Transparent blue
                hCtx.strokeStyle = "rgba(0, 150, 255, 0.9)"; // Darker blue border
                hCtx.lineWidth = 2;

                // Draw at canvas coordinates (no conversion needed)
                hCtx.fillRect(canvasX, canvasYTop, width, height);
                hCtx.strokeRect(canvasX, canvasYTop, width, height);

                console.log(`🎨 Highlight at X:${canvasX} Y:${canvasYTop} W:${width} H:${height}`);

                found = true;

                // Fetch word definition
                showMeaning(item.str);
            }
        });

        if (!found) {
            console.log("⚠️ No word found at clicked position.");
        }
    });
}

async function renderAllPages() {
  const container = document.getElementById("pdf-container");
  const renderedPages = [];
  // Render pages sequentially
  const renderPage = async (index) => {
    if (index < pdfDoc.numPages) {
      const page = await pdfDoc.getPage(index + 1);
      await renderPageToCanvas(page);
      renderedPages.push(page);
      await renderPage(index + 1);
    }
  };
  renderPage(0);
}

function showMeaning(word) {
  console.log("🔍 Fetching definition for:", word);
  
  const popup = document.getElementById("popup");
  popup.innerHTML = `<p>Loading...</p>`;
  popup.style.display = "block";
  
  fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`)
    .then(res => {
      console.log("📡 API Response Status:", res.status);
      if (!res.ok) {
        throw new Error(`API Error: ${res.status} ${res.statusText}`);
      }
      return res.json();
    })
    .then(data => {
      console.log("📦 API Data Received:", data);
      
      // Check if data is an array and has content
      if (!Array.isArray(data) || data.length === 0) {
        throw new Error("Empty or invalid API response");
      }

      let meaning = "No meaning found";
      try {
        if (data[0].meanings && data[0].meanings.length > 0) {
          const definitions = data[0].meanings[0].definitions;
          if (definitions && definitions.length > 0) {
            meaning = definitions[0].definition;
          }
        }
      } catch (e) {
        console.warn("⚠️ Error extracting meaning:", e);
      }

      popup.innerHTML = `
        <h3>${word}</h3>
        <p>${meaning}</p>
        <button onclick="saveWord('${word}', '${meaning}')">Save</button>
        <button onclick="document.getElementById('popup').style.display='none'">Close</button>
      `;
      popup.style.display = "block";
      console.log("✅ Popup displayed for:", word);
    })
    .catch(error => {
      console.error("❌ Error fetching definition:", error);
      popup.innerHTML = `
        <h3>${word}</h3>
        <p>❌ Error: ${error.message}</p>
        <p>Could not fetch definition. Please try again.</p>
        <button onclick="document.getElementById('popup').style.display='none'">Close</button>
      `;
      popup.style.display = "block";
    });
}

  // vocabulary memory 
  function saveWord(word, meaning) {
  let words = JSON.parse(localStorage.getItem("vocab")) || [];

  words.push({ word, meaning });

  localStorage.setItem("vocab", JSON.stringify(words));

  alert("Saved!");
    }
</script>
  
  <button onclick="showSaved()">View Saved Words</button>

  <script>
    // saved words
  function showSaved() {
  let words = JSON.parse(localStorage.getItem("vocab")) || [];

  let list = words.map(w => `<li><b>${w.word}</b>: ${w.meaning}</li>`).join("");

  const popup = document.getElementById("popup");
  popup.innerHTML = `<ul>${list}</ul>`;
  popup.style.display = "block";
  }
</script>

  <button onclick="savePDF()">Save PDF</button>
<button onclick="loadPDF()">Load Saved PDF</button>
<button onclick="deletePDF()">Delete PDF</button>
<script>

  //save
  function savePDF() {
  if (!currentPDFData) {
    alert("No PDF loaded!");
    return;
  }

  let tx = db.transaction("pdfs", "readwrite");
  let store = tx.objectStore("pdfs");

  store.put({
    id: "myPDF",
    data: currentPDFData
  });

  alert("PDF Saved!");
  }

  //load
  function loadPDF() {
  let tx = db.transaction("pdfs", "readonly");
  let store = tx.objectStore("pdfs");

  let req = store.get("myPDF");

  req.onsuccess = function() {
    if (!req.result) {
      alert("No saved PDF!");
      return;
    }

    let typedarray = new Uint8Array(req.result.data);

    pdfjsLib.getDocument(typedarray).promise.then(function(pdf) {
      pdfDoc = pdf;
      renderAllPages();
    });
  };
  }
// deletePDF 

  function deletePDF() {
  let tx = db.transaction("pdfs", "readwrite");
  let store = tx.objectStore("pdfs");

  store.delete("myPDF");

  alert("PDF Deleted!");
  }
  
</script>

</body>
</html>
