<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF Dictionary App</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <style>
    body {
      font-family: Arial;
      padding: 10px;
    }

    #pdf-container {
  height: 80vh;
  overflow-y: scroll;
  border: 1px solid #ccc;
}


  
}
    canvas {
      width: 100%;
      border: 1px solid #ccc;
      margin-top: 10px;
    }
    #popup {
      position: fixed;
      bottom: 20px;
      left: 10px;
      right: 10px;
      background: black;
      color: white;
      padding: 10px;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>
<body>

<h3>Upload PDF</h3>
<input type="file" id="upload" accept="application/pdf">


  <div id="pdf-container">
  <canvas id="pdf-render"></canvas>
</div>

<div id="popup"></div>

<script>
let pdfDoc = null;
let pageNum = 1;

document.getElementById('upload').addEventListener('change', function(e) {
  const file = e.target.files[0];
  const fileReader = new FileReader();

  fileReader.onload = function() {
    const typedarray = new Uint8Array(this.result);

    pdfjsLib.getDocument(typedarray).promise.then(function(pdf) {
      pdfDoc = pdf;
      renderPage(pageNum);
    });
  };

  fileReader.readAsArrayBuffer(file);
});


function renderAllPages() {
  const container = document.getElementById("pdf-container");
  container.innerHTML = "";

  for (let i = 1; i <= pdfDoc.numPages; i++) {
    pdfDoc.getPage(i).then(function(page) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      const viewport = page.getViewport({ scale: 1.5 });
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      container.appendChild(canvas);

      page.render({
        canvasContext: ctx,
        viewport: viewport
      });
    });
  }
}
    // Extract text
    page.getTextContent().then(function(textContent) {
  const textItems = textContent.items;

  canvas.addEventListener("click", function(e) {
    const x = e.offsetX;
    const y = e.offsetY;

    textItems.forEach(item => {
      const tx = item.transform[4];
      const ty = item.transform[5];
      const width = item.width;
      const height = item.height;

      if (
        x >= tx &&
        x <= tx + width &&
        y >= ty - height &&
        y <= ty
      ) {
        showMeaning(item.str);
      }
    });
  });
});
 }); 
}

function showMeaning(word) {
  fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`)
    .then(res => res.json())
    .then(data => {
      let meaning = "No meaning found";

      try {
        meaning = data[0].meanings[0].definitions[0].definition;
      } catch {}

      const popup = document.getElementById("popup");
      popup.innerHTML = `
        <h3>${word}</h3>
        <p>${meaning}</p>
        <button onclick="saveWord('${word}', '${meaning}')">Save</button>
      `;
      popup.style.display = "block";
    });
}

  // vocabulary memory 
  function saveWord(word, meaning) {
  let words = JSON.parse(localStorage.getItem("vocab")) || [];

  words.push({ word, meaning });

  localStorage.setItem("vocab", JSON.stringify(words));

  alert("Saved!");
    }
</script>
  
  <button onclick="showSaved()">View Saved Words</button>

  <script>
    // saved words
  function showSaved() {
  let words = JSON.parse(localStorage.getItem("vocab")) || [];

  let list = words.map(w => `<li><b>${w.word}</b>: ${w.meaning}</li>`).join("");

  const popup = document.getElementById("popup");
  popup.innerHTML = `<ul>${list}</ul>`;
  popup.style.display = "block";
  }
</script>
  
</body>
</html>
