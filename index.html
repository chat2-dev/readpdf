<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PDF Dictionary App</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
  <style>
    body {
      font-family: Arial;
      padding: 10px;
    }



    canvas {
      display: block;
      border: 1px solid #ccc;
      margin-top: 10px;
      margin: 0;
      padding: 0;
    }
    #pdf-container {
       height:80vh;
       overflow-y: scroll;
       border:1px solid #ccc;
    }
    #popup {
      position: fixed;
      bottom: 20px;
      left: 10px;
      right: 10px;
      background: black;
      color: white;
      padding: 15px;
      border-radius: 10px;
      display: none;
      z-index: 1000;
      max-height: 200px;
      overflow-y: auto;
    }
    
    .page-wrapper {
      position: relative;
      margin-bottom: 10px;
      margin: 0;
      padding: 0;
      width: fit-content;
    }
    
    .highlight-overlay {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 50;
      cursor: pointer;
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
      display: block;
    }
    
    #ocr-status {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #4CAF50;
      color: white;
      padding: 10px 15px;
      border-radius: 5px;
      display: none;
      z-index: 999;
    }

  </style>
</head>
<body>

<h3>Upload PDF</h3>
<input type="file" id="upload" accept="application/pdf">


  <div id="pdf-container">
  <canvas id="pdf-render"></canvas>
</div>

<div id="popup"></div>
<div id="ocr-status"></div>

<script>
  //database
  
  let pdfDoc = null; 
let currentPDFData = null;
let pageNum = 1;

  let db;

let request = indexedDB.open("PDFDatabase", 1);

request.onupgradeneeded = function(e) {
  db = e.target.result;
  db.createObjectStore("pdfs", { keyPath: "id" });
};

request.onsuccess = function(e) {
  db = e.target.result;
};

  // choose file 
 
document.getElementById('upload').addEventListener('change', function(e) {
  const file = e.target.files[0];
  const fileReader = new FileReader();

  fileReader.onload = function() {
  const typedarray = new Uint8Array(this.result);

  // 🔥 ADD THIS LINE (important)
  currentPDFData = this.result;

  pdfjsLib.getDocument(typedarray).promise.then(function(pdf) {
    pdfDoc = pdf;
    renderAllPages(); // also changed
  });
};

  fileReader.readAsArrayBuffer(file);
});

// render

async function renderPageToCanvas(page) {
    const container = document.getElementById("pdf-container");
    
    // Create wrapper for positioning
    const pageWrapper = document.createElement("div");
    pageWrapper.className = "page-wrapper";
    pageWrapper.style.margin = "0";
    pageWrapper.style.padding = "0";
    pageWrapper.style.marginTop = "10px";
    
    // Create main canvas for PDF rendering
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    const viewport = page.getViewport({ scale: 1.5 });
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.style.display = "block";
    canvas.style.margin = "0";
    canvas.style.padding = "0";
    canvas.style.border = "1px solid #ccc";
    
    // Create highlight overlay canvas - MUST match main canvas exactly
    const highlightCanvas = document.createElement("canvas");
    highlightCanvas.className = "highlight-overlay";
    highlightCanvas.width = viewport.width;  // Same width
    highlightCanvas.height = viewport.height;  // Same height
    highlightCanvas.style.position = "absolute";
    highlightCanvas.style.top = "0px";
    highlightCanvas.style.left = "0px";
    highlightCanvas.style.margin = "0";
    highlightCanvas.style.padding = "0";
    highlightCanvas.style.border = "none";
    highlightCanvas.style.display = "block";
    highlightCanvas.style.zIndex = "50";
    highlightCanvas.style.cursor = "pointer";
    
    pageWrapper.appendChild(canvas);
    pageWrapper.appendChild(highlightCanvas);
    container.appendChild(pageWrapper);
    
    console.log("🎨 Canvas dimensions - Width:", canvas.width, "Height:", canvas.height);
    console.log("🎨 Overlay dimensions - Width:", highlightCanvas.width, "Height:", highlightCanvas.height);
    
    // Render PDF to canvas
    await page.render({
        canvasContext: ctx,
        viewport: viewport
    }).promise;
    
    console.log("📄 Page rendered with viewport:", viewport.width, "x", viewport.height);
    
    // Extract text
    const textContent = await page.getTextContent();
    let textItems = textContent.items;
    
    console.log("📝 Found text items:", textItems.length);
    
    // Check if OCR is actually needed
    if (needsOCR(textItems)) {
        console.log("🖼️ Image-based PDF detected, running OCR...");
        showOCRStatus("🔄 Running OCR on page...");
        
        try {
            const result = await Tesseract.recognize(canvas, "eng");
            const ocrText = result.data.text;
            console.log("✅ OCR completed:", ocrText.substring(0, 100) + "...");
            
            // Parse OCR results into text items
            textItems = parseOCRResults(result.data.lines, viewport);
            console.log("📊 Converted OCR to", textItems.length, "text items");
            
            showOCRStatus("✅ OCR Complete", 3000);
        } catch (error) {
            console.error("❌ OCR Error:", error);
            showOCRStatus("⚠️ OCR failed, using regular text mode", 3000);
        }
    } else {
        console.log("✅ Readable PDF detected, using native text extraction");
    }
    
    // Add click handler for text detection
    setupCanvasClickHandler(canvas, highlightCanvas, viewport, textItems);
}

function needsOCR(textItems) {
    // Threshold: if we have very few text items, likely an image
    if (textItems.length < 3) {
        return true;
    }
    
    // Calculate total meaningful text length
    let totalTextLength = 0;
    let emptyItems = 0;
    
    textItems.forEach(item => {
        const text = item.str.trim();
        if (text.length === 0) {
            emptyItems++;
        } else {
            totalTextLength += text.length;
        }
    });
    
    console.log(`📊 Text analysis - Items: ${textItems.length}, Meaningful text: ${totalTextLength} chars, Empty: ${emptyItems}`);
    
    // If we have decent text content (more than 50 meaningful characters), skip OCR
    if (totalTextLength > 50) {
        return false;
    }
    
    // If more than 50% of items are empty/whitespace, likely needs OCR
    const emptyRatio = emptyItems / textItems.length;
    if (emptyRatio > 0.5) {
        console.log(`⚠️ High empty ratio (${(emptyRatio * 100).toFixed(1)}%), needs OCR`);
        return true;
    }
    
    return false;
}

function parseOCRResults(lines, viewport) {
    const textItems = [];
    
    lines.forEach((line) => {
        if (line.words) {
            line.words.forEach((word) => {
                if (word.text && word.text.trim()) {
                    // Extract bounding box info from Tesseract
                    const bbox = word.bbox;
                    const x0 = bbox.x0;
                    const y0 = bbox.y0;
                    const x1 = bbox.x1;
                    const y1 = bbox.y1;
                    
                    // Convert Tesseract coordinates to PDF.js format
                    // Tesseract: (0,0) is top-left, Y increases downward
                    // PDF.js: (0,0) is bottom-left, Y increases upward
                    const pdfX = x0;
                    const pdfY = viewport.height - y1;  // Convert to PDF baseline coordinate
                    
                    textItems.push({
                        str: word.text,
                        width: x1 - x0,
                        height: y1 - y0,
                        transform: [1, 0, 0, 1, pdfX, pdfY]
                    });
                    
                    console.log(`📝 OCR word "${word.text}" at PDF coords (${pdfX}, ${pdfY}), size ${x1 - x0}x${y1 - y0}`);
                }
            });
        }
    });
    
    console.log(`📊 Total OCR text items: ${textItems.length}`);
    return textItems;
}

function showOCRStatus(message, duration = 0) {
    const statusEl = document.getElementById("ocr-status");
    statusEl.textContent = message;
    statusEl.style.display = "block";
    
    if (duration > 0) {
        setTimeout(() => {
            statusEl.style.display = "none";
        }, duration);
    }
}

function setupCanvasClickHandler(canvas, highlightCanvas, viewport, textItems) {
    // Add click handler to both canvases to ensure proper detection
    const clickHandler = function(e) {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) * (canvas.width / rect.width);
        const y = (e.clientY - rect.top) * (canvas.height / rect.height);
        
        console.log("🖱️ Clicked at canvas position:", { x, y });
        console.log("📊 Canvas size:", { width: canvas.width, height: canvas.height });
        console.log("📊 Overlay size:", { width: highlightCanvas.width, height: highlightCanvas.height });
        
        let foundWord = false;
        textItems.forEach(item => {
            const tx = item.transform[4];  // X position in PDF coordinates
            const ty = item.transform[5];  // Y baseline position in PDF coordinates
            const width = item.width;
            const height = item.height;
            
            // Convert PDF coordinates to canvas coordinates
            // In PDF: (0,0) is bottom-left, Y increases upward
            // In Canvas: (0,0) is top-left, Y increases downward
            const canvasX = tx;
            const canvasYTop = viewport.height - (ty + height);  // Top of text in canvas coords
            const canvasYBottom = viewport.height - ty;  // Bottom of text in canvas coords
            
            console.log(`Checking word "${item.str}": PDF coords (${tx}, ${ty}), Canvas coords (${canvasX}, ${canvasYTop})`);
            
            if (
                x >= canvasX &&
                x <= canvasX + width &&
                y >= canvasYTop &&
                y <= canvasYBottom
            ) {
                foundWord = true;
                console.log("✨ Word detected:", item.str);
                
                // Clear previous highlights
                const hCtx = highlightCanvas.getContext("2d");
                hCtx.clearRect(0, 0, highlightCanvas.width, highlightCanvas.height);
                
                // Draw blue highlight box - use canvas coordinates directly
                hCtx.fillStyle = "rgba(0, 150, 255, 0.3)";
                hCtx.fillRect(canvasX, canvasYTop, width, height);
                hCtx.strokeStyle = "rgba(0, 150, 255, 0.9)";
                hCtx.lineWidth = 3;
                hCtx.strokeRect(canvasX, canvasYTop, width, height);
                
                console.log("🎨 Blue highlight drawn at:", { x: canvasX, y: canvasYTop, width, height });
                console.log("✅ Highlight canvas updated successfully");
                
                // Fetch definition
                showMeaning(item.str);
            }
        });
        
        if (!foundWord) {
            console.log("⚠️ No word found at clicked position");
        }
    };
    
    // Listen to clicks on both the main canvas and the highlight canvas
    canvas.addEventListener("click", clickHandler);
    highlightCanvas.addEventListener("click", clickHandler);
}

async function renderAllPages() {
  const container = document.getElementById("pdf-container");
  const renderedPages = [];
  // Render pages sequentially
  const renderPage = async (index) => {
    if (index < pdfDoc.numPages) {
      const page = await pdfDoc.getPage(index + 1);
      await renderPageToCanvas(page);
      renderedPages.push(page);
      await renderPage(index + 1);
    }
  };
  renderPage(0);
}

function showMeaning(word) {
  console.log("🔍 Fetching definition for:", word);
  
  const popup = document.getElementById("popup");
  popup.innerHTML = `<p>Loading...</p>`;
  popup.style.display = "block";
  
  fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`)
    .then(res => {
      console.log("📡 API Response Status:", res.status);
      if (!res.ok) {
        throw new Error(`API Error: ${res.status} ${res.statusText}`);
      }
      return res.json();
    })
    .then(data => {
      console.log("📦 API Data Received:", data);
      
      // Check if data is an array and has content
      if (!Array.isArray(data) || data.length === 0) {
        throw new Error("Empty or invalid API response");
      }

      let meaning = "No meaning found";
      try {
        if (data[0].meanings && data[0].meanings.length > 0) {
          const definitions = data[0].meanings[0].definitions;
          if (definitions && definitions.length > 0) {
            meaning = definitions[0].definition;
          }
        }
      } catch (e) {
        console.warn("⚠️ Error extracting meaning:", e);
      }

      popup.innerHTML = `
        <h3>${word}</h3>
        <p>${meaning}</p>
        <button onclick="saveWord('${word}', '${meaning}')">Save</button>
        <button onclick="document.getElementById('popup').style.display='none'">Close</button>
      `;
      popup.style.display = "block";
      console.log("✅ Popup displayed for:", word);
    })
    .catch(error => {
      console.error("❌ Error fetching definition:", error);
      popup.innerHTML = `
        <h3>${word}</h3>
        <p>❌ Error: ${error.message}</p>
        <p>Could not fetch definition. Please try again.</p>
        <button onclick="document.getElementById('popup').style.display='none'">Close</button>
      `;
      popup.style.display = "block";
    });
}

  // vocabulary memory 
  function saveWord(word, meaning) {
  let words = JSON.parse(localStorage.getItem("vocab")) || [];

  words.push({ word, meaning });

  localStorage.setItem("vocab", JSON.stringify(words));

  alert("Saved!");
    }
</script>
  
  <button onclick="showSaved()">View Saved Words</button>

  <script>
    // saved words
  function showSaved() {
  let words = JSON.parse(localStorage.getItem("vocab")) || [];

  let list = words.map(w => `<li><b>${w.word}</b>: ${w.meaning}</li>`).join("");

  const popup = document.getElementById("popup");
  popup.innerHTML = `<ul>${list}</ul>`;
  popup.style.display = "block";
  }
</script>

  <button onclick="savePDF()">Save PDF</button>
<button onclick="loadPDF()">Load Saved PDF</button>
<button onclick="deletePDF()">Delete PDF</button>
<script>

  //save
  function savePDF() {
  if (!currentPDFData) {
    alert("No PDF loaded!");
    return;
  }

  let tx = db.transaction("pdfs", "readwrite");
  let store = tx.objectStore("pdfs");

  store.put({
    id: "myPDF",
    data: currentPDFData
  });

  alert("PDF Saved!");
  }

  //load
  function loadPDF() {
  let tx = db.transaction("pdfs", "readonly");
  let store = tx.objectStore("pdfs");

  let req = store.get("myPDF");

  req.onsuccess = function() {
    if (!req.result) {
      alert("No saved PDF!");
      return;
    }

    let typedarray = new Uint8Array(req.result.data);

    pdfjsLib.getDocument(typedarray).promise.then(function(pdf) {
      pdfDoc = pdf;
      renderAllPages();
    });
  };
  }
// deletePDF 

  function deletePDF() {
  let tx = db.transaction("pdfs", "readwrite");
  let store = tx.objectStore("pdfs");

  store.delete("myPDF");

  alert("PDF Deleted!");
  }
  
</script>

</body>
</html>
